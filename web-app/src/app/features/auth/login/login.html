<div class="login-container">
  <div class="login-card">
    <div class="brand">
      <span class="logo-icon">💡</span>
      <h1>Idea Voting</h1>
    </div>
    <p class="subtitle">Faça login para compartilhar e votar em ideias.</p>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <!-- Trocamos o id por formControlName -->
        <input type="email" formControlName="email" placeholder="seu@email.com">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" formControlName="password" placeholder="••••••••">
      </div>

      <!-- Desabilitamos o botão se o formulário for inválido -->
      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">Entrar</button>
    </form>

    <p class="register-link">
      Ainda não tem conta? <a routerLink="/register">Cadastre-se aqui</a>
    </p>
  </div>
</div>
