services:
  # CIS API service (ASP.NET Core)
  cis-api:
    build:
      context: ./cis-api
      dockerfile: Dockerfile
    container_name: cis-api
    ports:
      - "8005:8005"
    environment:
      DatabaseConfig__Provider: "MongoDB"
      ConnectionStrings__CISDB: "server=mysql-db;port=3306;database=sd3db;user=root;password=root"
      ConnectionStrings__MongoDB: "mongodb://mongodb:27017"
    networks:
      - cis-network

  # Users API service (Spring Boot)
  users-api:
    build: ./user-api
    container_name: users-api
    restart: always
    ports:
      - "8001:8001"
    depends_on:
      mysql-db:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/sd3db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/sd3_users_db
    networks:
      - cis-network

  # Shared MySQL Database
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sd3db
    ports:
      - "3306:3306"
    volumes:
      - ./user-api/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cis-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Shared MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: mongodb_ds3
    restart: always
    environment:
      MONGO_INITDB_DATABASE: sd3_users_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cis-network

networks:
  cis-network:
    external: true

volumes:
  mongo_data: